stages:
  - build
  - deploy

variables:
  REGISTRY_HOST: "http://5.144.176.74:30050"
  REGISTRY_USER: "gitlab"
  REGISTRY_PASSWORD: "IuM0DYTEfPZuSa9"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: "latest"

.before_docker: &before_docker
  image: docker:latest
  services:
    - name: docker:dind
      command:
        - "--tls=false"
        - "--insecure-registry=5.144.176.74:30050"
  before_script:
    - echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin $REGISTRY_HOST

build-and-push-frontend:
  stage: build
  <<: *before_docker
  script:
    - docker build -t 5.144.176.74:30050/frontend:$IMAGE_TAG -f ./client/Dockerfile.prod ./client
    - docker push 5.144.176.74:30050/frontend:$IMAGE_TAG

build-and-push-backend:
  stage: build
  <<: *before_docker
  script:
    - docker build -t 5.144.176.74:30050/backend:$IMAGE_TAG -f ./server/php/Dockerfile.prod ./server
    - docker push 5.144.176.74:30050/backend:$IMAGE_TAG

deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl bash
    - curl -LO "https://dl.k8s.io/release/v1.30.1/bin/linux/amd64/kubectl"
    - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
    - echo "$KUBECONFIG_CONTENT" > kubeconfig.yaml
  script:
    - kubectl --kubeconfig=kubeconfig.yaml apply -f k8s/
    - kubectl --kubeconfig=kubeconfig.yaml rollout status deployment/frontend -n default
    - kubectl --kubeconfig=kubeconfig.yaml rollout status deployment/backend -n default
    - echo "Deployment applied successfully!"
    - kubectl --kubeconfig=kubeconfig.yaml get pods -o wide -n default
  needs:
    - build-and-push-frontend
    - build-and-push-backend