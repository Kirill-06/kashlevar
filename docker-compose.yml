services:
  php-fpm:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: php-fpm
    volumes:
      - ./server:/var/www/html
    networks:
      - backend

  nginx-api:
    image: nginx:1.25
    container_name: nginx-api
    ports:
      - "8080:80"
    volumes:
      - ./server:/var/www/html
      - ./nginx/api.dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm
    networks:
      - backend

  frontend:
    image: node:20
    container_name: frontend
    working_dir: /app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - WATCHPACK_POLLING=true
    volumes:
      - ./client:/app
    networks:
      - backend

  nginx-frontend:
    image: nginx:stable-alpine
    container_name: nginx-frontend
    ports:
      - "8081:80"
    volumes:
      - ./client/build:/usr/share/nginx/html
      - ./nginx/frontend.dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
    networks:
      - backend

networks:
  backend: